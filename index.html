<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đố Vui Lịch Sử Việt Nam</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4ecd8; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); width: 90%; max-width: 500px; text-align: center; }
        h1 { color: #8b0000; margin-bottom: 20px; border-bottom: 2px solid #8b0000; padding-bottom: 10px; }
        .question { font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; }
        .btn-grid { display: grid; gap: 10px; }
        .btn { background: #fff; border: 2px solid #8b0000; color: #8b0000; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #8b0000; color: #fff; }
        .score-container { font-size: 1.5rem; font-weight: bold; color: #8b0000; }
        .hide { display: none; }
    </style>
</head>
<body>

<div class="quiz-card">
    <h1>Đố Vui Lịch Sử</h1>
    
    <div id="quiz-box">
        <div id="question" class="question">Câu hỏi sẽ hiện ở đây</div>
        <div id="answer-buttons" class="btn-grid"></div>
    </div>

    <div id="result-box" class="hide">
        <h2>Kết Quả</h2>
        <p class="score-container">Bạn đạt được <span id="score">0</span> điểm!</p>
        <button class="btn" onclick="startQuiz()">Chơi lại</button>
    </div>
</div>

<script>
    // Danh sách câu hỏi lịch sử
    const questions = [
        {
            question: "Ai là vị vua đầu tiên của nhà Lý?",
            answers: [
                { text: "Lý Thái Tổ", correct: true },
                { text: "Lý Thái Tông", correct: false },
                { text: "Lý Thánh Tông", correct: false },
                { text: "Lý Nhân Tông", correct: false }
            ]
        },
        {
            question: "Chiến thắng Điện Biên Phủ diễn ra vào năm nào?",
            answers: [
                { text: "1945", correct: false },
                { text: "1954", correct: true },
                { text: "1968", correct: false },
                { text: "1975", correct: false }
            ]
        },
        {
            question: "Trận chiến trên sông Bạch Đằng năm 938 gắn liền với vị tướng nào?",
            answers: [
                { text: "Trần Hưng Đạo", correct: false },
                { text: "Lê Hoàn", correct: false },
                { text: "Ngô Quyền", correct: true },
                { text: "Lê Lợi", correct: false }
            ]
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const questionElement = document.getElementById('question');
    const answerButtonsElement = document.getElementById('answer-buttons');
    const quizBox = document.getElementById('quiz-box');
    const resultBox = document.getElementById('result-box');
    const scoreElement = document.getElementById('score');

    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        quizBox.classList.remove('hide');
        resultBox.classList.add('hide');
        showQuestion();
    }

    function showQuestion() {
        resetState();
        let currentQuestion = questions[currentQuestionIndex];
        questionElement.innerText = `Câu ${currentQuestionIndex + 1}: ${currentQuestion.question}`;

        currentQuestion.answers.forEach(answer => {
            const button = document.createElement('button');
            button.innerText = answer.text;
            button.classList.add('btn');
            if (answer.correct) {
                button.dataset.correct = answer.correct;
            }
            button.addEventListener('click', selectAnswer);
            answerButtonsElement.appendChild(button);
        });
    }

    function resetState() {
        while (answerButtonsElement.firstChild) {
            answerButtonsElement.removeChild(answerButtonsElement.firstChild);
        }
    }

    function selectAnswer(e) {
        const selectedBtn = e.target;
        const isCorrect = selectedBtn.dataset.correct === "true";
        if (isCorrect) {
            score++;
        }
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        quizBox.classList.add('hide');
        resultBox.classList.remove('hide');
        scoreElement.innerText = `${score}/${questions.length}`;
    }

    startQuiz();
</script>

</body>
</html>
